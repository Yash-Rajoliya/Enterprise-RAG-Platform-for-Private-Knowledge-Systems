apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: enterprise-rag-ingress

spec:
  rules:
    - host: rag.company.ai

      http:
        paths:
          - path: /

            pathType: Prefix

            backend:
              service:
                name: api-server-service

                port:
                  number: 80