version: "3.9"

services:

  api-server:
    build: ../../apps/api-server
    ports:
      - "8000:8000"

  query-orchestrator:
    build: ../../services/query-orchestrator
    ports:
      - "8001:8001"

  retrieval-service:
    build: ../../services/retrieval-service
    ports:
      - "8002:8002"

  ingestion-service:
    build: ../../services/ingestion-service
    ports:
      - "8003:8003"

  llm-service:
    build: ../../services/llm-service
    ports:
      - "8004:8004"

  embedding-service:
    build: ../../services/embedding-service
    ports:
      - "8005:8005"

  redis:
    image: redis:7

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: enterprise_rag

  kafka:
    image: bitnami/kafka:latest