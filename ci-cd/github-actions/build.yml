name: Build

on:
  push:
    branches:
      - main

jobs:

  docker-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-server
          - retrieval-service
          - query-orchestrator
          - ingestion-service
          - llm-service

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t enterprise-rag/${{ matrix.service }} \
            ./services/${{ matrix.service }}