version: "3.9"

services:

  api-server:
    build:
      context: ./apps/api-server
    ports:
      - "8000:8000"

    env_file:
      - .env.example

    depends_on:
      - redis
      - postgres

  query-orchestrator:
    build:
      context: ./services/query-orchestrator

  retrieval-service:
    build:
      context: ./services/retrieval-service

  ingestion-service:
    build:
      context: ./services/ingestion-service

  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: enterprise_rag

    ports:
      - "5432:5432"